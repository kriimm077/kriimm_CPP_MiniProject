<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🏏 HAND CRICKET PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root {
        --primary: #00f0ff;
        --accent: #ff2a9d;
        --gold: #ffd700;
        --green: #00ff88;
        --dark: #0a0f1f;
    }
  
    * { margin:0; padding:0; box-sizing:border-box; }
  
    body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: linear-gradient(135deg, #0a0f1f, #1a2540);
        color: white;
        overflow: hidden;
        height: 100dvh;
        touch-action: manipulation;
    }

    .header {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 18px;
        background: linear-gradient(#1a2540, #0f1629);
        text-align: center;
        font-size: 2.1rem;
        font-weight: 900;
        letter-spacing: 5px;
        z-index: 100;
        box-shadow: 0 6px 30px rgba(0,240,255,0.3);
        text-shadow: 0 0 20px var(--primary);
    }

    #gameContainer {
        position: relative;
        height: calc(100dvh - 78px);
        margin-top: 78px;
        background: linear-gradient(to bottom, #1e5c2f 25%, #0f3a1f);
        overflow: hidden;
    }

    /* === IMPROVED PITCH === */
    .pitch {
        position: absolute;
        top: 48%; left: 50%;
        transform: translate(-50%, -50%);
        width: 560px; height: 240px;
        background: repeating-linear-gradient(38deg, 
            #e8d5a3 0px, #e8d5a3 35px, 
            #d4b87f 35px, #d4b87f 70px);
        border: 18px solid #8b5a1a;
        border-radius: 12px;
        box-shadow: 
            0 35px 90px rgba(0,0,0,0.85),
            inset 0 0 60px rgba(255,255,255,0.15);
        z-index: 2;
    }

    .pitch::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent, rgba(255,255,255,0.08));
        border-radius: 8px;
    }

    /* === REALISTIC HANDS === */
    .hand-container {
        position: absolute;
        bottom: 85px;
        width: 230px;
        height: 260px;
        cursor: pointer;
        z-index: 10;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.4);
    }
    .hand-left { left: 8%; }
    .hand-right { right: 8%; }

    .hand {
        width: 100%; height: 100%;
        background: linear-gradient(145deg, #f8d4a0, #e89c5e, #d67f3a);
        border-radius: 50% 50% 45% 45%;
        box-shadow: 
            0 30px 70px rgba(0,0,0,0.8),
            inset 0 25px 40px rgba(255,255,255,0.45),
            inset 0 -15px 30px rgba(0,0,0,0.4);
        position: relative;
        border: 14px solid #fff;
        overflow: hidden;
    }

    .hand::before {
        content: '';
        position: absolute;
        top: 25%;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        height: 55%;
        background: rgba(255,255,255,0.25);
        border-radius: 50%;
        filter: blur(8px);
    }

    .fingers {
        position: absolute;
        top: 22%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 2;
    }

    .finger {
        width: 22px;
        background: linear-gradient(#ffe8c4, #e8b878);
        border-radius: 50px 50px 20px 20px;
        box-shadow: 0 8px 15px rgba(0,0,0,0.5);
        transition: all 0.3s;
    }

    /* === CENTRAL DISPLAY === */
    #central {
        position: absolute;
        top: 32%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 30;
        pointer-events: none;
    }
    #bigNumber {
        font-size: 10rem;
        font-weight: 900;
        line-height: 1;
        color: #fff;
        text-shadow: 
            0 0 40px var(--gold),
            0 0 80px var(--accent),
            0 0 120px #ff00ff;
    }

    #commentary {
        font-size: 2.8rem;
        font-weight: 900;
        color: var(--gold);
        text-shadow: 0 4px 25px #000;
        min-height: 75px;
        margin-top: 10px;
    }

    /* === UI IMPROVEMENTS === */
    .num-pad {
        position: fixed;
        bottom: 35px;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: repeat(6, 78px);
        gap: 18px;
        z-index: 50;
    }
    .num-btn {
        width: 78px; height: 78px;
        font-size: 2.4rem;
        font-weight: bold;
        background: linear-gradient(145deg, #ffd700, #ffaa00);
        color: #111;
        border: 7px solid #fff;
        border-radius: 50%;
        box-shadow: 0 15px 40px rgba(255,215,0,0.7);
        transition: all 0.2s;
    }
    .num-btn:active {
        transform: scale(0.78) rotate(15deg);
        box-shadow: 0 8px 20px rgba(255,215,0,0.5);
    }

    .popup {
        position: fixed;
        inset: 0;
        background: rgba(8,12,28,0.97);
        display: none;
        flex-direction: column;
        align-items:center;
        justify-content:center;
        z-index: 200;
    }

    @keyframes popAnim {
        0% { transform: scale(0.2) rotate(-12deg); }
        50% { transform: scale(1.25); }
        100% { transform: scale(1); }
    }
</style>
</head>
<body>
<div class="header">🏏 HAND CRICKET PRO</div>

<!-- GAME CONTAINER -->
<div id="gameContainer">
    <div class="pitch"></div>
    
    <div class="hand-container hand-left" id="playerContainer">
        <div class="hand" id="playerHand">
            <div class="fingers" id="playerFingers"></div>
        </div>
    </div>

    <div class="hand-container hand-right" id="cpuContainer">
        <div class="hand" id="cpuHand">
            <div class="fingers" id="cpuFingers"></div>
        </div>
    </div>

    <div id="central">
        <div id="bigNumber">—</div>
        <div id="commentary">YOUR MOVE</div>
    </div>

    <div id="statusText" style="position:absolute;top:28px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);padding:14px 45px;border-radius:50px;z-index:40;font-weight:700;border:3px solid var(--primary);font-size:1.1rem;">
    </div>

    <div style="position:absolute;top:105px;right:30px;background:rgba(0,0,0,0.85);padding:16px 35px;border-radius:18px;z-index:40;text-align:right;border:2px solid var(--gold);">
        <div id="scoreDisplay" style="font-size:2.3rem;font-weight:bold;">0 - 0</div>
        <div id="targetDisplay" style="color:var(--gold);margin-top:5px;">Target —</div>
    </div>

    <div class="num-pad">
        <button class="num-btn" onclick="playMove(1)">1</button>
        <button class="num-btn" onclick="playMove(2)">2</button>
        <button class="num-btn" onclick="playMove(3)">3</button>
        <button class="num-btn" onclick="playMove(4)">4</button>
        <button class="num-btn" onclick="playMove(5)">5</button>
        <button class="num-btn" onclick="playMove(6)">6</button>
    </div>
</div>

<!-- Result Popup -->
<div id="resultPopup" class="popup">
    <h2 id="finalResult" style="font-size:4.5rem;margin:20px 0;"></h2>
    <div id="finalScore" style="font-size:2.5rem;margin:20px 0;"></div>
    <button onclick="location.reload()" style="padding:22px 80px;font-size:1.6rem;background:linear-gradient(#ffd700,#ff8800);color:#111;border:none;border-radius:60px;">PLAY AGAIN</button>
</div>

<script>
// =============== GAME STATE ===============
let playerScore = 0, cpuScore = 0, balls = 6, innings = 1, target = 0;
let isPlayerBatting = true;
let gameActive = false;
let isProcessing = false;

const $ = id => document.getElementById(id);

// =============== IMPROVED FINGERS ===============
function createFingers(containerId, num) {
    const container = $(containerId);
    container.innerHTML = '';
    
    if (num === 6) {
        const thumb = document.createElement('div');
        thumb.style.width = '48px';
        thumb.style.height = '68px';
        thumb.style.background = 'linear-gradient(#ffe8c4, #e8b878)';
        thumb.style.borderRadius = '50%';
        thumb.style.transform = 'rotate(35deg)';
        thumb.style.marginTop = '12px';
        container.appendChild(thumb);
    } else {
        for (let i = 0; i < num; i++) {
            const f = document.createElement('div');
            f.className = 'finger';
            f.style.height = (48 + i*10) + 'px';
            container.appendChild(f);
        }
    }
}

function showPopNumber(num) {
    const el = $('bigNumber');
    el.textContent = num + (num >= 4 ? "!!!" : "");
    el.style.animation = 'popAnim 0.7s';
}

function animateHand(isPlayer) {
    const container = isPlayer ? $('playerContainer') : $('cpuContainer');
    container.style.transform = isPlayer 
        ? 'scale(0.72) translateY(45px)' 
        : 'scale(0.78) translateY(-35px)';
    setTimeout(() => container.style.transform = '', 380);
}

// =============== PLAY MOVE ===============
async function playMove(playerNum) {
    if (!gameActive || isProcessing) return;
    isProcessing = true;

    const cpuNum = Math.floor(Math.random() * 6) + 1;
    
    animateHand(true);
    animateHand(false);
    createFingers('playerFingers', playerNum);
    createFingers('cpuFingers', cpuNum);
    showPopNumber(playerNum);

    await new Promise(r => setTimeout(r, 450));

    if (playerNum === cpuNum) {
        $('commentary').innerHTML = "🥾 <span style='color:#ff3366'>OUT!</span>";
        new Audio('https://assets.mixkit.co/sfx/preview/mixkit-arcade-retro-game-over-213.mp3').play();
        
        if (innings === 1) {
            innings = 2;
            target = playerScore + 1;
            isPlayerBatting = !isPlayerBatting;
            balls = 6;
        } else {
            endGame();
        }
    } else {
        const runs = isPlayerBatting ? playerNum : cpuNum;
        if (isPlayerBatting) playerScore += runs;
        else cpuScore += runs;

        const comm = $('commentary');
        if (runs === 6) comm.innerHTML = "🚀 SIXER!!! 🔥";
        else if (runs === 4) comm.innerHTML = "💥 FOUR!!!";
        else comm.textContent = "Nice Shot!";

        if (runs >= 4) new Audio('https://assets.mixkit.co/sfx/preview/mixkit-stadium-crowd-cheer-2023.mp3').play();
        else new Audio('https://assets.mixkit.co/sfx/preview/mixkit-baseball-hit-ball-2073.mp3').play();
    }

    $('scoreDisplay').textContent = `${playerScore} - ${cpuScore}`;
    balls--;

    if (balls <= 0 && innings === 1) {
        innings = 2;
        target = playerScore + 1;
        isPlayerBatting = !isPlayerBatting;
        balls = 6;
    }

    if (innings === 2) {
        if ((isPlayerBatting && playerScore >= target) || (!isPlayerBatting && cpuScore >= target)) {
            endGame();
        }
    }

    updateStatus();
    isProcessing = false;
}

function updateStatus() {
    $('statusText').textContent = `${innings}st Innings • ${isPlayerBatting ? 'BATTING' : 'BOWLING'}`;
    if (target > 0) $('targetDisplay').textContent = `Target: ${target}`;
}

// =============== INITIAL SETUP ===============
function startGame() {
    gameActive = true;
    balls = 6;
    innings = 1;
    playerScore = cpuScore = 0;
    target = 0;
    updateStatus();
    createFingers('playerFingers', 3);
    createFingers('cpuFingers', 3);
}

// Auto start for demo (you can connect it to toss later)
window.onload = () => {
    $('gameContainer').style.display = 'block';
    startGame();
};

// Keyboard Support
document.addEventListener('keydown', e => {
    if (gameActive && !isProcessing && e.key >= '1' && e.key <= '6') playMove(+e.key);
});
</script>
</body>
</html>
